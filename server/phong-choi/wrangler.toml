name = "dcc-phong-choi"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[durable_objects.bindings]]
name = "JIGSAW"
class_name = "JigsawV2"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Store"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Jigsaw"]

# 2026-10-20: a deploy never restarted the running object (players kept it busy for hours, so new code never ran). Renaming the class keeps
# every stored row and the object named 'main', and starts it again on the new code.
[[migrations]]
tag = "v4"
renamed_classes = [{ from = "Jigsaw", to = "JigsawV2" }]
